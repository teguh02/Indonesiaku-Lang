name: Automated Tests

on:
  push:
    branches:
      - main
      - develop
      # Branch seri pemeliharaan (1.0.x, 1.1.x, ...). Tambalan untuk rilis
      # lama justru yang paling butuh diuji, jadi jangan sampai lolos CI.
      - '[0-9]+.[0-9]+.x'
    paths:
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - 'examples/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
      - develop
      - '[0-9]+.[0-9]+.x'
  workflow_dispatch:  # Allow manual trigger

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gcc-version: ['11', '12']  # Reduced from 3 to 2 for faster builds
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.gcc-version }} make
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ matrix.gcc-version }} 100
          gcc --version

      - name: Build project
        run: |
          make clean
          make || (echo "Build failed" && exit 1)

      - name: Check binary exists
        run: |
          test -f ./indk && ls -lh ./indk || (echo "Binary not found!" && exit 1)
          ./indk -v

      - name: Run tests
        run: |
          chmod +x tests/test_all.sh
          bash tests/test_all.sh

  # Alpine memakai musl, bukan glibc. Keduanya berbeda soal header mana yang
  # menarik header lain: glibc menyediakan struct timeval lewat <sys/socket.h>
  # secara tidak langsung, musl TIDAK. Tanpa job ini, kode yang lupa
  # #include <sys/time.h> tetap hijau di seluruh CI dan baru ketahuan rusak
  # saat seseorang membangun image Docker -- itu persis yang terjadi.
  test-musl:
    name: Build on musl (Alpine)
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        # python3: dibutuhkan tests/test_templat_playground.sh. Tanpa itu
        # tesnya gagal dengan "python3: command not found", bukan karena musl.
        run: apk add --no-cache build-base bash curl python3

      - name: Build
        run: make

      - name: Run tests
        run: |
          chmod +x tests/test_all.sh
          bash tests/test_all.sh

  todo-crud:
    name: Todo-list JSON DB (CLI CRUD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Build
        run: |
          make clean
          make

      - name: Todo CLI CRUD integration test
        run: |
          chmod +x tests/test_todo_cli.sh
          bash tests/test_todo_cli.sh

  todo-http:
    name: Todo-list REST API (HTTP server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GCC + curl
        run: sudo apt-get update && sudo apt-get install -y gcc make curl

      - name: Build
        run: |
          make clean
          make

      - name: Todo REST server integration test
        run: |
          chmod +x tests/test_todo_server.sh
          bash tests/test_todo_server.sh

      - name: HTTP client integration test
        run: bash tests/test_klien_http.sh

  editor-lsp:
    name: VS Code LSP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install mingw make -y
          refreshenv

      - name: Build interpreter (Linux/macOS)
        if: runner.os != 'Windows'
        run: make clean && make

      - name: Build interpreter (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          make clean
          make

      - name: Test LSP and formatter clients
        working-directory: editors/vscode-indonesiaku
        run: |
          npm run test:lsp
          npm run test:format

  sanitizers:
    name: ASan + UBSan (stress GC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Build with AddressSanitizer + UBSan + stress GC
        run: |
          gcc -std=c11 -g -O1 -Isrc \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DDEBUG_STRESS_GC \
            -o indk_asan \
            src/main.c src/indk_api.c src/chunk.c src/compiler.c src/debug.c src/format.c src/memory.c \
            src/native.c src/object.c src/scanner.c src/table.c src/value.c src/vm.c src/db.c src/pola.c src/sistem.c src/tls.c src/sqlite3.c src/vendor/mbedtls/library/*.c -Isrc/vendor/mbedtls/include -DMBEDTLS_USER_CONFIG_FILE='"mbedtls_user_config.h"' -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_DQS=0 -DSQLITE_THREADSAFE=0 -DSQLITE_DEFAULT_MEMSTATUS=0 -lm

      - name: Run every example under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          # A memory/UB error makes indk_asan exit non-zero with a sanitizer
          # report; that fails the step. Program-level runtime errors (exit 70)
          # are expected for some inputs and are not sanitizer failures.
          rc=0
          for f in examples/*.idk examples/oop/*.idk; do
            echo "== $f =="
            # timeout: examples/todo_server.idk melayani request selamanya.
            # Tanpa ini job menggantung sampai batas 6 jam GitHub lalu dibatalkan.
            # Server diuji terpisah oleh tests/test_todo_server.sh.
            out="$(timeout 120 ./indk_asan "$f" 2>&1)" || true
            if echo "$out" | grep -Eq "ERROR: (AddressSanitizer|LeakSanitizer)|runtime error:"; then
              echo "$out"
              echo "SANITIZER FAILURE in $f"
              rc=1
            fi
          done
          exit $rc

  valgrind:
    name: Valgrind leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y gcc make valgrind

      - name: Build (debug)
        run: |
          gcc -std=c11 -g -O0 -Isrc -o indk_dbg \
            src/main.c src/indk_api.c src/chunk.c src/compiler.c src/debug.c src/format.c src/memory.c \
            src/native.c src/object.c src/scanner.c src/table.c src/value.c src/vm.c src/db.c src/pola.c src/sistem.c src/tls.c src/sqlite3.c src/vendor/mbedtls/library/*.c -Isrc/vendor/mbedtls/include -DMBEDTLS_USER_CONFIG_FILE='"mbedtls_user_config.h"' -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_DQS=0 -DSQLITE_THREADSAFE=0 -DSQLITE_DEFAULT_MEMSTATUS=0 -lm

      - name: Valgrind on representative examples
        run: |
          rc=0
          for f in examples/hello.idk examples/variabel.idk examples/fibonacci.idk \
                   examples/fungsi_string.idk examples/state_management.idk \
                   examples/regresi_logika.idk examples/closure.idk examples/list.idk \
                   examples/kamus.idk examples/oop/kelas.idk examples/coba_kecuali.idk; do
            echo "== valgrind $f =="
            valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite \
              ./indk_dbg "$f" > /dev/null || { echo "LEAK/ERROR in $f"; rc=1; }
          done
          exit $rc

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y gcc make lcov

      - name: Build with coverage instrumentation
        run: |
          # mbedTLS dikompilasi TANPA --coverage. Dua alasan: cakupan 132.812
          # baris kode pihak ketiga tidak mengukur apa pun tentang Indonesiaku
          # dan hanya menenggelamkan angka kita, dan .gcda vendor membuat lcov
          # gagal dengan "stamp mismatch" saat ada artefak build sebelumnya.
          gcc -std=c11 -O0 -g -Isrc -Isrc/vendor/mbedtls/include -DMBEDTLS_USER_CONFIG_FILE='"mbedtls_user_config.h"' -c src/vendor/mbedtls/library/*.c
          mkdir -p mbedtls-obj && mv *.o mbedtls-obj/
          gcc -std=c11 -O0 -g --coverage -Isrc -Isrc/vendor/mbedtls/include -DMBEDTLS_USER_CONFIG_FILE='"mbedtls_user_config.h"' -o indk \
            src/main.c src/indk_api.c src/chunk.c src/compiler.c src/debug.c src/format.c src/memory.c \
            src/native.c src/object.c src/scanner.c src/table.c src/value.c src/vm.c src/db.c src/pola.c src/sistem.c src/tls.c src/sqlite3.c mbedtls-obj/*.o -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_DQS=0 -DSQLITE_THREADSAFE=0 -DSQLITE_DEFAULT_MEMSTATUS=0 -lm

      - name: Exercise every example
        run: |
          for f in examples/*.idk examples/oop/*.idk; do
            # timeout: lihat catatan di job sanitizers — todo_server.idk tidak berhenti sendiri.
            timeout 120 ./indk "$f" > /dev/null 2>&1 || true
          done

      - name: Generate lcov report
        run: |
          # --ignore-errors gcov: .gcda yatim dari langkah build lain di runner
          # yang sama membuat lcov keluar 1 walaupun laporan kita sendiri utuh.
          lcov --capture --directory . --output-file coverage.info \
            --ignore-errors mismatch,negative,gcov,inconsistent,empty
          # Kode pihak ketiga dibuang dari laporan, bukan sekadar tidak diukur.
          lcov --remove coverage.info '*/src/vendor/*' '*/src/sqlite3.c' \
            --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.info

  fuzz:
    name: Fuzz scanner/compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build libFuzzer target
        run: |
          clang -g -O1 -fsanitize=fuzzer,address,undefined -Isrc \
            tests/fuzz_compile.c src/indk_api.c src/chunk.c src/compiler.c src/debug.c src/format.c \
            src/memory.c src/native.c src/object.c src/scanner.c src/table.c \
            src/value.c src/vm.c src/db.c src/pola.c src/sistem.c src/tls.c src/sqlite3.c src/vendor/mbedtls/library/*.c -Isrc/vendor/mbedtls/include -DMBEDTLS_USER_CONFIG_FILE='"mbedtls_user_config.h"' -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_DQS=0 -DSQLITE_THREADSAFE=0 -DSQLITE_DEFAULT_MEMSTATUS=0 -lm -o fuzz_compile

      - name: Seed corpus from examples
        run: |
          mkdir -p corpus
          cp examples/*.idk corpus/ 2>/dev/null || true

      - name: Fuzz (short run; fails on any crash)
        run: |
          # Front-end only (scanner + compiler); the target never executes
          # bytecode, so program-level infinite loops cannot cause timeouts.
          # A timeout here would indicate a genuine compiler hang.
          ./fuzz_compile corpus -max_total_time=60 -max_len=2048 \
            -timeout=10 -rss_limit_mb=2048 -print_final_stats=1 < /dev/null

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install make gcc 2>/dev/null || true
          gcc --version

      - name: Build project
        run: |
          make clean
          make || (echo "Build failed" && exit 1)

      - name: Check binary exists
        run: |
          test -f ./indk && ls -lh ./indk || (echo "Binary not found!" && exit 1)
          ./indk -v

      - name: Run tests
        run: |
          chmod +x tests/test_all.sh
          bash tests/test_all.sh

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MinGW (Chocolatey)
        shell: powershell
        run: |
          choco install mingw make -y
          refreshenv
          gcc --version
          make --version
        continue-on-error: true

      - name: Build project (MinGW)
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          make clean
          make

      - name: Check if binary exists
        shell: powershell
        run: |
          if (Test-Path "indk.exe") {
            Write-Host "[OK] indk.exe found"
            & .\indk.exe -v
          } else {
            Write-Host "[FAIL] indk.exe not found"
            exit 1
          }

      - name: Run tests (PowerShell)
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          & powershell -ExecutionPolicy Bypass -File tests/test_all.ps1

      # tests/test_all.ps1 hanya menjalankan golden + tes galat. Sub-suite di
      # tests/*.sh tidak pernah jalan di Windows, jadi fitur yang hanya diuji
      # di sana tidak terlindungi di sini. Runner windows-latest punya Git
      # Bash, jadi sub-suite yang tidak butuh docker/curl/dpkg bisa dijalankan
      # apa adanya -- tanpa menduplikasi tesnya ke PowerShell.
      #
      # test_baca_sumber.sh sengaja TIDAK ikut: ia menguji readFile() pada pipe
      # lewat /proc/self/fd/0, konstruksi POSIX yang tidak ada padanannya di
      # Windows (indk juga belum menerima '-' sebagai nama berkas stdin). Tes
      # itu tetap jalan di Linux dan macOS.
      #
      # test_panduan.sh ikut: ia hanya butuh awk/sed/grep/mktemp dan sudah
      # menangani absennya `timeout` (GNU coreutils) dengan menjalankan blok
      # tanpa batas waktu. 202 contoh di website/panduan/ sebelumnya tidak
      # pernah dieksekusi di Windows sama sekali.
      #
      # templat_sabotase.sh TIDAK ikut, dua alasan: ia meta-test (memeriksa
      # apakah tes LAIN menangkap kerusakan, sama seperti migrasi_sabotase.sh),
      # dan ia memanggil `python3` yang di Git Bash Windows biasanya bernama
      # `python`. Perilaku templat sendiri diuji di Windows lewat golden
      # examples/templat_dasar.idk yang dipindai tests/test_all.ps1.
      # templat_cache.sh ikut: hanya butuh bash + indk. Uji "suntingan
      # berukuran sama" memakai jeda 1,1 detik atas waktu() supaya mtime
      # bergeser walau sistem berkas hanya beresolusi detik (NTFS sendiri
      # beresolusi 100ns, jadi jeda ini kelebihan di Windows — tapi murah
      # dan membuat tesnya sama persis di ketiga OS).
      - name: Run shell-based sub-suites (Git Bash)
        shell: bash
        run: |
          set -u
          gagal=0
          for t in tests/builtin_konsisten.sh \
                   tests/test_anotasi_bytecode.sh \
                   tests/test_baris_panjang.sh \
                   tests/test_format.sh \
                   tests/test_impor_lokasi.sh \
                   tests/test_awakutu.sh \
                   tests/test_tabel_mask.sh \
                   tests/test_benchmark.sh \
                   tests/test_lint.sh \
                   tests/test_profil.sh \
                   tests/test_uji.sh \
                   tests/test_panduan.sh \
                   tests/templat_cache.sh \
                   tests/templat_diagnosis.sh \
                   tests/sandbox.sh \
                   tests/embedding.sh; do
            echo "=== $t ==="
            if bash "$t"; then echo "  ok"; else echo "  GAGAL: $t"; gagal=1; fi
          done
          exit $gagal

      # Dua skrip ini sudah ada di repo sejak lama tetapi tidak pernah
      # dipanggil siapa pun: padanan Linux-nya (test_todo_cli.sh,
      # test_todo_server.sh) jalan di CI, versi Windows-nya menganggur.
      - name: Run Todo CLI integration test (PowerShell)
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          & powershell -ExecutionPolicy Bypass -File tests/test_todo_cli.ps1

      - name: Run Todo HTTP server integration test (PowerShell)
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          & powershell -ExecutionPolicy Bypass -File tests/test_todo_server.ps1

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail the build if quality checks fail
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check critical files
        run: |
          echo "Checking critical files..."
          test -f Makefile && echo "[OK] Makefile exists" || echo "[FAIL] Makefile missing"
          test -f src/main.c && echo "[OK] src/main.c exists" || echo "[FAIL] src/main.c missing"
          test -f README.md && echo "[OK] README.md exists" || echo "[FAIL] README.md missing"
          echo "File check completed"

  build-documentation:
    name: Verify Documentation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check documentation files
        run: |
          echo "Checking documentation..."
          test -f README.md && echo "[OK] README.md" || exit 1
          test -f CHANGELOG.md && echo "[OK] CHANGELOG.md" || exit 1
          test -f LICENSE && echo "[OK] LICENSE" || exit 1
          test -d website && echo "[OK] website/" || exit 1
          test -f website/docs.html && echo "[OK] website/docs.html" || exit 1
          test -d website/panduan && echo "[OK] website/panduan/" || exit 1
          test -d docs && echo "[OK] docs/" || exit 1
          test -d examples && echo "[OK] examples/" || exit 1
          echo ""
          echo "Documentation check passed!"

      - name: Verify example files
        run: |
          echo "Checking example files..."
          find examples -name "*.idk" -type f | wc -l
          test -f examples/hello.idk && echo "[OK] hello.idk" || exit 1
          test -f examples/fibonacci.idk && echo "[OK] fibonacci.idk" || exit 1

  report-results:
    name: Test Results Report
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos, test-windows]
    if: always()
    continue-on-error: true
    
    steps:
      - name: Print summary
        run: |
          echo "::group::Build Results Summary"
          echo "Linux Tests: ${{ needs.test-linux.result }}"
          echo "macOS Tests: ${{ needs.test-macos.result }}"
          echo "Windows Tests: ${{ needs.test-windows.result }}"
          echo "::endgroup::"

  create-badge:
    name: Update Status Badge
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos, test-windows]
    if: always()
    continue-on-error: true
    
    steps:
      - name: Generate badge
        run: |
          echo "::group::Build Status"
          if [ "${{ needs.test-linux.result }}" = "success" ]; then
            echo "[OK] Linux Tests: PASSED"
          else
            echo "[WARN] Linux Tests: FAILED/SKIPPED"
          fi
          
          if [ "${{ needs.test-macos.result }}" = "success" ]; then
            echo "[OK] macOS Tests: PASSED"
          else
            echo "[WARN] macOS Tests: FAILED/SKIPPED"
          fi
          
          if [ "${{ needs.test-windows.result }}" = "success" ]; then
            echo "[OK] Windows Tests: PASSED"
          else
            echo "[WARN] Windows Tests: FAILED/SKIPPED"
          fi
          echo "::endgroup::"
