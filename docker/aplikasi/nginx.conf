# Reverse proxy di depan server Indonesiaku.
#
# Tugasnya: menghadapi internet supaya aplikasi tidak perlu. TLS, batas ukuran
# permintaan, batas laju, dan timeout diselesaikan di sini.

worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Jangan umumkan versi nginx di header dan halaman galat.
    server_tokens off;

    sendfile on;
    access_log /dev/stdout;

    # Rootfs container read-only; satu-satunya yang bisa ditulis adalah tmpfs
    # /var/cache/nginx. Tanpa baris-baris ini nginx gagal start karena
    # mencoba membuat direktori sementara di /var/lib/nginx.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # Batas ukuran permintaan ditegakkan di proxy, sebelum aplikasi membaca
    # satu bita pun. Naikkan bila memang menerima unggahan besar.
    client_max_body_size 1m;

    # Batas laju: 10 permintaan/detik per IP, boleh melonjak 20. Ini penting
    # justru karena app.jalankan() melayani SATU permintaan pada satu waktu --
    # tanpa batas laju, satu klien sibuk membuat yang lain menunggu.
    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

    # Klien lambat dihentikan di proxy, bukan di aplikasi.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    upstream aplikasi {
        server app:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # ---------------------------------------------------------------
        # TLS: aktifkan setelah punya sertifikat, lalu ganti blok di atas
        # dengan pengalihan ke https.
        #
        #   listen 443 ssl;
        #   http2 on;
        #   ssl_certificate     /etc/nginx/tls/fullchain.pem;
        #   ssl_certificate_key /etc/nginx/tls/privkey.pem;
        #   ssl_protocols       TLSv1.2 TLSv1.3;
        #   ssl_prefer_server_ciphers off;
        #   ssl_session_cache   shared:SSL:10m;
        #   ssl_session_timeout 1d;
        #   add_header Strict-Transport-Security "max-age=31536000" always;
        #
        # dan server HTTP menjadi pengalihan saja:
        #
        #   server {
        #       listen 80;
        #       server_name contoh.id;
        #       return 301 https://$host$request_uri;
        #   }
        # ---------------------------------------------------------------

        location / {
            limit_req zone=perip burst=20 nodelay;

            proxy_pass http://aplikasi;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }
    }
}
